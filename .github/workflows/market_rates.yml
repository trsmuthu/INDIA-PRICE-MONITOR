name: India Market Rates Daily Monitor

on:
  schedule:
    # 03:35 UTC = 9:05 AM IST (Morning opening rates, Mon-Fri)
    - cron: '35 3 * * 1-5'
    # 08:30 UTC = 2:00 PM IST (Mid-day market update, Mon-Fri)
    - cron: '0 8 * * 1-5'
    # 12:35 UTC = 6:05 PM IST (Evening market close rates, Mon-Fri)
    - cron: '35 12 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime

jobs:
  check-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Push Market Rates
        env:
          NTFY_TOPIC: india-market-rates-muthu
        run: |
          python3 monitor.py
